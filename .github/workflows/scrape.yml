name: Atualizar Painel de Vagas

on:
  schedule:
    - cron: '0 */6 * * *' # Roda a cada 6 horas
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão para commitar as atualizações no repositório

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Executar Scraper
        run: python scraper.py

      - name: Commitar e dar push se houver alterações
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add vagas.json vagas.js
          git diff-index --quiet HEAD || (git commit -m "update: atualiza painel de vagas automaticamente [skip ci]" && git push)
